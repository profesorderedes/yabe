services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/data/database.sqlite
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - sqlite-data:/var/www/html/data
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  sqlite-data:
